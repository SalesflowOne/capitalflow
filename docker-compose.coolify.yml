services:
  configure:
    image: capitalflow-frappe:${FRAPPE_VERSION:-develop}
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      restart_policy:
        condition: none
    entrypoint:
      - bash
      - '-c'
    command:
      - "ls -1 apps > sites/apps.txt; bench set-config -g db_host db; bench set-config -gp db_port 3306; bench set-config -g redis_cache redis://redis:6379; bench set-config -g redis_queue redis://redis:6379; bench set-config -g redis_socketio redis://redis:6379; bench set-config -gp socketio_port 9000; echo \"Configuration Complete\";\n"
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'

  create-site:
    image: capitalflow-frappe:${FRAPPE_VERSION:-develop}
    deploy:
      restart_policy:
        condition: none
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'
    environment:
      SITE_NAME: '${SITE_NAME}'
      ADMIN_PASSWORD: '${SERVICE_PASSWORD_ADMIN}'
      DB_ROOT_PASSWORD: '${SERVICE_PASSWORD_DB}'
    entrypoint:
      - bash
      - '-c'
    command:
      - |
        wait-for-it -t 120 db:3306
        wait-for-it -t 120 redis:6379
        if [ ! -f "sites/$${SITE_NAME}/site_config.json" ]; then
          rm -rf "sites/$${SITE_NAME}"
          echo "Site $${SITE_NAME} does not exist. Creating now..."
          bench new-site "$${SITE_NAME}" \
            --mariadb-root-password "$${DB_ROOT_PASSWORD}" \
            --db-root-username "root" \
            --admin-password "$${ADMIN_PASSWORD}" \
            --mariadb-user-host-login-scope '%' \
            --install-app erpnext \
            --install-app lending \
            --set-default
          echo "Site created successfully."
        else
          echo "Site $${SITE_NAME} already exists. Skipping creation."
        fi
    depends_on:
      configure:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    image: capitalflow-frappe:${FRAPPE_VERSION:-develop}
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - /home/frappe/frappe-bench/env/bin/gunicorn
      - -b
      - 0.0.0.0:8000
      - -w
      - '1'
      - -t
      - '120'
      - frappe.app:application
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'
    depends_on:
      create-site:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    image: capitalflow-frappe:${FRAPPE_VERSION:-develop}
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: 'backend:8000'
      SOCKETIO: 'websocket:9000'
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: 'off'
      PROXY_READ_TIMEOUT: 300
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.capitalflow-gzip.compress=true
      - traefik.http.middlewares.capitalflow-redirect.redirectscheme.scheme=https
      - traefik.http.routers.capitalflow-http.rule=Host(`${SERVICE_FQDN_FRONTEND}`)
      - traefik.http.routers.capitalflow-http.entryPoints=http
      - traefik.http.routers.capitalflow-http.middlewares=capitalflow-redirect
      - traefik.http.routers.capitalflow-https.rule=Host(`${SERVICE_FQDN_FRONTEND}`)
      - traefik.http.routers.capitalflow-https.entryPoints=https
      - traefik.http.routers.capitalflow-https.tls=true
      - traefik.http.routers.capitalflow-https.tls.certresolver=letsencrypt
      - traefik.http.routers.capitalflow-https.middlewares=capitalflow-gzip
      - traefik.http.services.capitalflow.loadbalancer.server.port=8080
    depends_on:
      backend:
        condition: service_started

  db:
    image: '${MARIADB_IMAGE:-mariadb:10.6}'
    command:
      - '--character-set-server=utf8mb4'
      - '--collation-server=utf8mb4_unicode_ci'
      - '--skip-character-set-client-handshake'
      - '--skip-innodb-read-only-compressed'
      - '--innodb-buffer-pool-size=128M'
    environment:
      MYSQL_ROOT_PASSWORD: '${SERVICE_PASSWORD_DB}'
      MARIADB_ROOT_PASSWORD: '${SERVICE_PASSWORD_DB}'
    volumes:
      - 'db-data:/var/lib/mysql'
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - '-h'
        - localhost
        - '--password=${SERVICE_PASSWORD_DB}'
      interval: 5s
      retries: 20

  redis:
    image: '${REDIS_IMAGE:-redis:6.2-alpine}'
    command:
      - redis-server
      - '--maxmemory'
      - 96mb
      - '--maxmemory-policy'
      - allkeys-lru
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      retries: 5

volumes:
  db-data: null
  sites: null
  logs: null
